[tool.ruff]
# The MINIMUM Python this project supports. Django 6.1 supports 3.12-3.14;
# keeping the floor at 3.12 also stops the formatter rewriting exception
# groups into PEP 758 (3.14-only) syntax.
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade.
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]  # line length is enforced by the formatter, not the linter

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
